<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="100%" role="img" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>DisplayBridge 功能流程图</title>
  <desc>DisplayBridge 三条并列连接链路（原生随航、Sunshine 串流副屏、OpenDisplay）及底部后台保障闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="240" y="24" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">打开 DisplayBridge</text>
  </g>

  <path d="M340 72 L130 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 72 L340 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 72 L550 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="112" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="130" y="133" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">连接随航</text>
    <text x="130" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">一键开关</text>
    <rect x="40" y="178" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="130" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">选择目标设备</text>
    <text x="130" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">auto / core / ui</text>
    <rect x="40" y="244" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="130" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">已连接</text>
    <text x="130" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">扩展桌面</text>
    <rect x="40" y="310" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="130" y="331" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">断开随航</text>
    <text x="130" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">离线回退系统设置</text>
  </g>
  <path d="M130 168 L130 178" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M130 234 L130 244" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M130 300 L130 310" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="112" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="133" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">连接副屏</text>
    <text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Sunshine 串流</text>
    <rect x="250" y="178" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">启动 Sunshine</text>
    <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">+ BetterDisplay 虚拟屏</text>
    <rect x="250" y="244" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">已连接</text>
    <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">PIN 配对完成</text>
    <rect x="250" y="310" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="331" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">断开</text>
    <text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">三者一起退出</text>
  </g>
  <path d="M340 168 L340 178" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 234 L340 244" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 300 L340 310" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="460" y="112" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="550" y="133" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">连接 OpenDisplay</text>
    <text x="550" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">App Store 下载</text>
    <rect x="460" y="178" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="550" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">连接中</text>
    <text x="550" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">进程 + 虚拟屏双条件</text>
    <rect x="460" y="244" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="550" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">已连接</text>
    <text x="550" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">虚拟屏建立</text>
    <rect x="460" y="310" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="550" y="331" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">断开</text>
    <text x="550" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">结束进程</text>
  </g>
  <path d="M550 168 L550 178" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 234 L550 244" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 300 L550 310" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#5F5E5A">后台保障 · 对三种连接都生效</text>

  <g>
    <rect x="40" y="428" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="110" y="449" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">后台常驻</text>
    <text x="110" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">关窗口不退出</text>
    <rect x="193" y="428" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="263" y="449" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">休眠监听</text>
    <text x="263" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">合盖 / 待机 / 睡眠</text>
    <rect x="346" y="428" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="416" y="449" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">超时自动断开</text>
    <text x="416" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">10 / 20 / 30 分</text>
    <rect x="499" y="428" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="569" y="449" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">唤醒自动重连</text>
    <text x="569" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">回到连接态</text>
  </g>
  <path d="M180 456 L193 456" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M333 456 L346 456" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M486 456 L499 456" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M569 500 L115 500" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="340" y="518" text-anchor="middle" font-size="12" fill="#5F5E5A">持续循环 · 后台监控一直运行</text>
</svg>
